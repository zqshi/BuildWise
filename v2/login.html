<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BuildWise</title>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-light: #93C5FD;
            --secondary: #8B5CF6;
            --text-dark: #1F2937;
            --text-gray: #6B7280;
            --text-light: #9CA3AF;
            --bg-light: #F9FAFB;
            --bg-white: #FFFFFF;
            --border: #E5E7EB;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
        }
        
        .logo img {
            height: 2.5rem;
            margin-right: 0.75rem;
        }
        
        .logo span {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        
        .header p {
            font-size: 0.875rem;
            color: var(--text-gray);
        }
        
        /* 登录卡片 */
        .login-card {
            background-color: var(--bg-white);
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }
        
        /* 表单 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-dark);
        }
        
        .form-group input {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-group input::placeholder {
            color: var(--text-light);
        }
        
        .form-group .label-with-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .form-group .label-with-link a {
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .form-group .label-with-link a:hover {
            text-decoration: underline;
        }
        
        .form-group.checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-group.checkbox-group input {
            width: auto;
            margin: 0;
        }
        
        .form-group.checkbox-group label {
            font-weight: 400;
            color: var(--text-gray);
            margin: 0;
        }
        
        /* 按钮 */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: var(--shadow-lg);
        }
        
        .btn-secondary {
            background-color: var(--bg-white);
            color: var(--text-dark);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background-color: var(--bg-light);
        }
        
        /* 分隔线 */
        .divider {
            position: relative;
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border);
        }
        
        .divider span {
            position: relative;
            background-color: var(--bg-white);
            padding: 0 1rem;
            font-size: 0.75rem;
            color: var(--text-light);
            margin: 0 auto;
        }
        
        /* 第三方登录 */
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background-color: var(--bg-white);
            color: var(--text-dark);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .social-btn:hover {
            background-color: var(--bg-light);
        }
        
        .social-btn img {
            height: 1.25rem;
            width: 1.25rem;
        }
        
        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .footer p {
            font-size: 0.875rem;
            color: var(--text-gray);
        }
        
        .footer a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        /* 响应式 */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .social-login {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <a href="index.html" class="logo">
                <img src="https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/1a5ebec8fbe741ebbfb124a09735dda5~tplv-a9rns2rl98-image.image?lk3s=8e244e95&rcl=202601261338417EDCB751369F1113DEAA&rrcfp=f06b921b&x-expires=1771997950&x-signature=9%2B3grfpaYbFdeteO6C3%2B%2BwmHaPg%3D" alt="BuildWise">
                <span>BuildWise</span>
            </a>
            <h1>欢迎回来</h1>
            <p>登录你的账户，继续使用 BuildWise</p>
        </div>
        
        <!-- 登录卡片 -->
        <div class="login-card">
            <form class="form" id="loginForm">
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" name="email" placeholder="请输入你的电子邮箱" required>
                </div>
                
                <div class="form-group">
                    <div class="label-with-link">
                        <label for="password">密码</label>
                        <a href="#">忘记密码？</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="请输入你的密码" required>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住我</label>
                </div>
                
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            
            <div class="divider">
                <span>或者使用</span>
            </div>
            
            <div class="social-login">
                <button type="button" class="social-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    Google
                </button>
                <button type="button" class="social-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Apple_logo_black.svg/1667px-Apple_logo_black.svg.png" alt="Apple">
                    Apple
                </button>
            </div>
        </div>
        
        <!-- 底部 -->
        <div class="footer">
            <p>还没有账户？ <a href="#">免费注册</a></p>
        </div>
    </div>

    <script>
        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 简单的表单验证
            if (!email || !password) {
                alert('请填写所有必填字段');
                return;
            }
            
            // 模拟登录成功，跳转到仪表盘
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        });
        
        // 第三方登录按钮
        document.querySelectorAll('.social-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const provider = this.textContent.trim();
                alert(`${provider} 登录功能开发中`);
            });
        });
        
        // 忘记密码链接
        document.querySelector('.label-with-link a').addEventListener('click', function(e) {
            e.preventDefault();
            alert('忘记密码功能开发中');
        });
        
        // 注册链接
        document.querySelector('.footer a').addEventListener('click', function(e) {
            e.preventDefault();
            alert('注册功能开发中');
        });
    </script>
</body>
</html>
