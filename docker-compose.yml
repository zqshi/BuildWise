services:
  buildwise:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5055:5055"
    volumes:
      - buildwise-data:/app/data
    environment:
      - NODE_ENV=production
      - AUTH_MODE=jwt
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL_SEC=${JWT_ACCESS_TTL_SEC:-1800}
      - JWT_REFRESH_TTL_SEC=${JWT_REFRESH_TTL_SEC:-604800}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-200}
      - SHUTDOWN_TIMEOUT_MS=${SHUTDOWN_TIMEOUT_MS:-10000}
      - STORAGE_BACKEND=sqlite
      - LOG_FORMAT=json
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_REQUIRED=${LLM_REQUIRED:-false}
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - buildwise-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5055/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  buildwise-data:

networks:
  buildwise-net:
    driver: bridge
