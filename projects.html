<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理 - VisionCraft</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#EC4899',
                        dark: '#1F2937',
                        light: '#F9FAFB'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary;
            }
            .bg-gradient-primary {
                @apply bg-gradient-to-r from-primary to-secondary;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .btn-primary {
                @apply bg-gradient-primary text-white font-medium py-2 px-4 rounded-lg hover:opacity-90 transition-all duration-300 shadow-md hover:shadow-lg;
            }
            .btn-secondary {
                @apply bg-white text-dark font-medium py-2 px-4 rounded-lg hover:bg-gray-50 transition-all duration-300 shadow-sm hover:shadow-md border border-gray-200;
            }
            .sidebar-link {
                @apply flex items-center px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors;
            }
            .sidebar-link.active {
                @apply bg-primary bg-opacity-10 text-primary font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside class="w-64 bg-white shadow-sm hidden md:block">
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center">
                    <a href="index.html">
                        <img src="https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/1a5ebec8fbe741ebbfb124a09735dda5~tplv-a9rns2rl98-image.image?lk3s=8e244e95&rcl=202601261338417EDCB751369F1113DEAA&rrcfp=f06b921b&x-expires=1771997950&x-signature=9%2B3grfpaYbFdeteO6C3%2B%2BwmHaPg%3D" alt="VisionCraft" class="h-8">
                    </a>
                    <span class="ml-3 text-lg font-bold">VisionCraft</span>
                </div>
            </div>
            
            <div class="p-4">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="font-semibold text-sm">免费试用</h4>
                        <span class="text-xs bg-primary text-white px-2 py-0.5 rounded-full">14 天</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                        <div class="bg-primary h-2 rounded-full" style="width: 7%;"></div>
                    </div>
                    <p class="text-xs text-gray-600">剩余 13 天</p>
                </div>
                
                <nav class="space-y-1">
                    <a href="trial-dashboard.html" class="sidebar-link">
                        <i class="fa fa-dashboard w-5 h-5 mr-3"></i>
                        <span>仪表盘</span>
                    </a>
                    <a href="projects.html" class="sidebar-link active">
                        <i class="fa fa-folder w-5 h-5 mr-3"></i>
                        <span>项目</span>
                    </a>
                </nav>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <header class="bg-white shadow-sm">
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center">
                        <button class="md:hidden mr-4 text-gray-600" id="mobile-menu-button">
                            <i class="fa fa-bars text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <a href="help-center.html" class="text-gray-600 hover:text-primary">
                            <i class="fa fa-question-circle text-xl"></i>
                        </a>
                        <button class="text-gray-600 hover:text-primary relative">
                            <i class="fa fa-bell text-xl"></i>
                            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        
                        <div class="relative" id="user-menu">
                            <button class="flex items-center space-x-2" id="user-menu-button">
                                <img src="https://randomuser.me/api/portraits/women/32.jpg" alt="用户头像" class="w-8 h-8 rounded-full">
                                <span class="hidden sm:block font-medium">李明</span>
                                <i class="fa fa-chevron-down text-xs text-gray-500"></i>
                            </button>
                            
                            <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 hidden" id="user-dropdown">
                                <a href="settings.html" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">账号设置</a>
                                <div class="border-t border-gray-200 my-1"></div>
                                <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-100" id="logout-button">退出登录</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-4 md:p-6">
                <div class="max-w-7xl mx-auto">
                    <!-- 操作栏 -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 class="text-2xl font-bold mb-1">我的项目</h2>
                            <p class="text-gray-600">管理和查看你的所有项目</p>
                        </div>
                        <button id="create-project-btn" class="btn-primary">
                            <i class="fa fa-plus mr-2"></i>
                            创建新项目
                        </button>
                    </div>
                    
                    <!-- 项目列表 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- 项目卡片 1 -->
                        <div class="bg-white rounded-xl shadow-sm overflow-hidden card-hover">
                            <div class="p-6">
                                <div class="flex items-center justify-between mb-4">
                                    <h3 class="font-semibold text-lg">我的第一个项目</h3>
                                    <span class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">活跃</span>
                                </div>
                                <p class="text-gray-600 text-sm mb-4">React 项目，用于测试 VisionCraft 功能</p>
                                <div class="flex items-center justify-between text-xs text-gray-500 mb-6">
                                    <span>创建于 2023-07-21</span>
                                    <span>最后更新: 今天</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <span class="flex items-center text-xs text-gray-600">
                                            <i class="fa fa-file-o mr-1"></i>
                                            0 个设计
                                        </span>
                                        <span class="flex items-center text-xs text-gray-600">
                                            <i class="fa fa-code mr-1"></i>
                                            0 次生成
                                        </span>
                                    </div>
                                    <a href="project-detail.html" class="text-primary text-sm font-medium hover:underline">查看详情</a>
                                </div>
                            </div>
                            <div class="bg-gray-50 px-6 py-3 flex justify-end space-x-2">
                                <button class="text-gray-500 hover:text-primary p-1">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button class="text-gray-500 hover:text-red-500 p-1">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 创建新项目卡片 -->
                        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 flex flex-col items-center justify-center text-center h-full min-h-[200px] hover:border-primary hover:text-primary transition-colors cursor-pointer" id="create-project-card">
                            <div class="w-12 h-12 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mb-4">
                                <i class="fa fa-plus text-primary text-xl"></i>
                            </div>
                            <h3 class="font-semibold text-lg mb-2">创建新项目</h3>
                            <p class="text-gray-500 text-sm">开始一个新的设计到代码的旅程</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- 移动端侧边栏 -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden" id="mobile-sidebar-overlay">
        <div class="w-64 bg-white h-full overflow-y-auto">
            <div class="p-4 border-b border-gray-200 flex items-center justify-between">
                <div class="flex items-center">
                    <a href="index.html">
                        <img src="https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/1a5ebec8fbe741ebbfb124a09735dda5~tplv-a9rns2rl98-image.image?lk3s=8e244e95&rcl=202601261338417EDCB751369F1113DEAA&rrcfp=f06b921b&x-expires=1771997950&x-signature=9%2B3grfpaYbFdeteO6C3%2B%2BwmHaPg%3D" alt="VisionCraft" class="h-8">
                    </a>
                    <span class="ml-3 text-lg font-bold">VisionCraft</span>
                </div>
                <button id="close-mobile-sidebar">
                    <i class="fa fa-times text-gray-600"></i>
                </button>
            </div>
            
            <div class="p-4">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <h4 class="font-semibold text-sm">免费试用</h4>
                        <span class="text-xs bg-primary text-white px-2 py-0.5 rounded-full">14 天</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                        <div class="bg-primary h-2 rounded-full" style="width: 7%;"></div>
                    </div>
                    <p class="text-xs text-gray-600">剩余 13 天</p>
                </div>
                
                <nav class="space-y-1">
                    <a href="trial-dashboard.html" class="sidebar-link">
                        <i class="fa fa-dashboard w-5 h-5 mr-3"></i>
                        <span>仪表盘</span>
                    </a>
                    <a href="projects.html" class="sidebar-link active">
                        <i class="fa fa-folder w-5 h-5 mr-3"></i>
                        <span>项目</span>
                    </a>
                </nav>
            </div>
        </div>
    </div>

    <!-- 创建项目模态框 -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden" id="create-project-modal">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-xl max-w-md w-full">
                <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                    <h3 class="text-lg font-semibold">创建新项目</h3>
                    <button id="close-modal-btn" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="p-6">
                    <form id="create-project-form" class="space-y-4">
                        <div>
                            <label for="project-name" class="block text-sm font-medium text-gray-700 mb-1">项目名称</label>
                            <input type="text" id="project-name" name="project-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请输入项目名称" required>
                        </div>
                        <div>
                            <label for="project-description" class="block text-sm font-medium text-gray-700 mb-1">项目描述（可选）</label>
                            <textarea id="project-description" name="project-description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="请描述你的项目"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">选择技术栈</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                    <input type="radio" name="tech-stack" value="react" class="mr-2" checked>
                                    <span>React</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                    <input type="radio" name="tech-stack" value="vue" class="mr-2">
                                    <span>Vue</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                    <input type="radio" name="tech-stack" value="angular" class="mr-2">
                                    <span>Angular</span>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                                    <input type="radio" name="tech-stack" value="html" class="mr-2">
                                    <span>HTML/CSS</span>
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="p-6 border-t border-gray-200 flex justify-end space-x-3">
                    <button id="cancel-create-project-btn" class="btn-secondary">取消</button>
                    <button id="submit-create-project-btn" class="btn-primary">创建</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 移动端侧边栏切换
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileSidebarOverlay = document.getElementById('mobile-sidebar-overlay');
        const closeMobileSidebar = document.getElementById('close-mobile-sidebar');
        
        mobileMenuButton.addEventListener('click', () => {
            mobileSidebarOverlay.classList.remove('hidden');
        });
        
        closeMobileSidebar.addEventListener('click', () => {
            mobileSidebarOverlay.classList.add('hidden');
        });
        
        mobileSidebarOverlay.addEventListener('click', (e) => {
            if (e.target === mobileSidebarOverlay) {
                mobileSidebarOverlay.classList.add('hidden');
            }
        });
        
        // 用户菜单切换
        const userMenuButton = document.getElementById('user-menu-button');
        const userDropdown = document.getElementById('user-dropdown');
        
        userMenuButton.addEventListener('click', () => {
            userDropdown.classList.toggle('hidden');
        });
        
        document.addEventListener('click', (e) => {
            const userMenu = document.getElementById('user-menu');
            if (!userMenu.contains(e.target)) {
                userDropdown.classList.add('hidden');
            }
        });

        // 退出登录
        document.getElementById('logout-button').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'login.html';
            }
        });

        // 创建项目模态框
        const createProjectBtn = document.getElementById('create-project-btn');
        const createProjectCard = document.getElementById('create-project-card');
        const createProjectModal = document.getElementById('create-project-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelCreateProjectBtn = document.getElementById('cancel-create-project-btn');
        const submitCreateProjectBtn = document.getElementById('submit-create-project-btn');

        function openModal() {
            createProjectModal.classList.remove('hidden');
        }

        function closeModal() {
            createProjectModal.classList.add('hidden');
        }

        createProjectBtn.addEventListener('click', openModal);
        createProjectCard.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelCreateProjectBtn.addEventListener('click', closeModal);

        submitCreateProjectBtn.addEventListener('click', () => {
            const projectName = document.getElementById('project-name').value;
            if (projectName) {
                // 模拟创建项目成功，跳转到项目详情页
                window.location.href = 'project-detail.html';
            } else {
                alert('请输入项目名称');
            }
        });
    </script>
</body>
</html>
