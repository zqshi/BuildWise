<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - VisionCraft</title>
    <!-- 本地CSS样式 -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .text-gradient {
            background: linear-gradient(to right, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        
        .bg-gradient-primary {
            background: linear-gradient(to right, #3B82F6, #8B5CF6);
        }
        
        .btn-primary {
            background: linear-gradient(to right, #3B82F6, #8B5CF6);
            color: white;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .btn-secondary {
            background-color: white;
            color: #1F2937;
            font-weight: 500;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-secondary:hover {
            background-color: #f9fafb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        
        /* 自定义图标 */
        .fa {
            display: inline-block;
            font: normal normal normal 14px/1 FontAwesome;
            font-size: inherit;
            text-rendering: auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .fa-star:before { content: "\f005"; }
        .fa-lightbulb-o:before { content: "\f0eb"; }
        .fa-code:before { content: "\f121"; }
        .fa-object-group:before { content: "\f247"; }
        .fa-sync:before { content: "\f021"; }
        .fa-database:before { content: "\f1c0"; }
        .fa-sliders:before { content: "\f1de"; }
        .fa-users:before { content: "\f0c0"; }
        .fa-play-circle:before { content: "\f144"; }
        .fa-arrow-right:before { content: "\f061"; }
        .fa-check:before { content: "\f00c"; }
        .fa-times:before { content: "\f00d"; }
        .fa-twitter:before { content: "\f099"; }
        .fa-facebook:before { content: "\f09a"; }
        .fa-instagram:before { content: "\f16d"; }
        .fa-linkedin:before { content: "\f08c"; }
        .fa-github:before { content: "\f09b"; }
        .fa-rocket:before { content: "\f135"; }
        .fa-chevron-down:before { content: "\f078"; }
        .fa-bars:before { content: "\f0c9"; }
        .fa-play:before { content: "\f04b"; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- 头部 -->
        <div class="text-center mb-8">
            <a href="index.html" class="flex items-center justify-center">
                <img src="https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/super_tool/1a5ebec8fbe741ebbfb124a09735dda5~tplv-a9rns2rl98-image.image?lk3s=8e244e95&rcl=202601261338417EDCB751369F1113DEAA&rrcfp=f06b921b&x-expires=1771997950&x-signature=9%2B3grfpaYbFdeteO6C3%2B%2BwmHaPg%3D" alt="VisionCraft" class="h-10">
                <span class="ml-3 text-xl font-bold">VisionCraft</span>
            </a>
            <h1 class="text-2xl font-bold mt-4">欢迎回来</h1>
            <p class="text-gray-600 mt-2">登录你的账户，继续使用 VisionCraft</p>
        </div>
        
        <!-- 登录表单 -->
        <div class="bg-white rounded-xl shadow-lg p-8">
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">电子邮箱</label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="请输入你的电子邮箱" required>
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
                        <a href="#" class="text-xs text-primary hover:underline">忘记密码？</a>
                    </div>
                    <input type="password" id="password" name="password" class="input-field" placeholder="请输入你的密码" required>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember" class="mr-2">
                    <label for="remember" class="text-sm text-gray-600">记住我</label>
                </div>
                
                <button type="submit" class="btn-primary w-full">
                    登录
                </button>
            </form>
            
            <div class="relative flex items-center justify-center my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative px-4 bg-white text-sm text-gray-500">
                    或者使用
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <button type="button" class="flex items-center justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 transition-colors">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="h-5 w-5 mr-2">
                    Google
                </button>
                <button type="button" class="flex items-center justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 transition-colors">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Apple_logo_black.svg/1667px-Apple_logo_black.svg.png" alt="Apple" class="h-5 w-5 mr-2">
                    Apple
                </button>
            </div>
        </div>
        
        <!-- 底部 -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                还没有账户？ <a href="start-trial.html" class="text-primary font-medium hover:underline">免费注册</a>
            </p>
        </div>
    </div>

    <script>
        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 简单的表单验证
            if (!email || !password) {
                alert('请填写所有必填字段。');
                return;
            }
            
            // 模拟登录成功，跳转到试用仪表盘
            window.location.href = 'trial-dashboard.html';
        });
    </script>
    <script src="js/app.js"></script>
</body>
</html>
