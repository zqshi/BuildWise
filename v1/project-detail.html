<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 - VisionCraft</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#8B5CF6',
                        accent: '#EC4899',
                        dark: '#1F2937',
                        light: '#F9FAFB'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                @apply bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary;
            }
            .bg-gradient-primary {
                @apply bg-gradient-to-r from-primary to-secondary;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .btn-primary {
                @apply bg-gradient-primary text-white font-medium py-2 px-4 rounded-lg hover:opacity-90 transition-all duration-300 shadow-md hover:shadow-lg;
            }
            .btn-secondary {
                @apply bg-white text-dark font-medium py-2 px-4 rounded-lg hover:bg-gray-50 transition-all duration-300 shadow-sm hover:shadow-md border border-gray-200;
            }
            .sidebar-link {
                @apply flex items-center px-4 py-3 text-gray-600 rounded-lg hover:bg-gray-100 transition-colors;
            }
            .sidebar-link.active {
                @apply bg-primary bg-opacity-10 text-primary font-medium;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-dark">
    <div class="flex-1 flex flex-col overflow-hidden h-screen">
            <!-- 顶部导航 -->
            <header class="bg-white shadow-sm">
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center">
                        <a href="projects.html" class="flex items-center text-gray-800 hover:text-primary mr-4">
                            <i class="fa fa-arrow-left mr-2"></i>
                            <span class="font-medium">返回项目</span>
                        </a>
                        <div>
                            <div class="flex items-center">
                                <h1 class="text-xl font-bold">我的第一个项目</h1>
                                <span class="ml-3 text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full">活跃</span>
                            </div>
                            <p class="text-sm text-gray-500">React</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center space-x-4">
                        <button class="text-gray-600 hover:text-primary relative">
                            <i class="fa fa-bell text-xl"></i>
                            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                        </button>
                        
                        <div class="relative">
                            <button class="flex items-center space-x-2" id="user-menu-button">
                                <img src="https://randomuser.me/api/portraits/women/32.jpg" alt="用户头像" class="w-8 h-8 rounded-full">
                                <span class="hidden sm:block font-medium">李明</span>
                                <i class="fa fa-chevron-down text-xs text-gray-500"></i>
                            </button>
                            
                            <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 hidden" id="user-dropdown">
                                <a href="settings.html" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">账号设置</a>
                                <div class="border-t border-gray-200 my-1"></div>
                                <a href="#" class="block px-4 py-2 text-gray-600 hover:bg-gray-100" id="logout-button">退出登录</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-4 md:p-6">
                <div class="max-w-7xl mx-auto">
                    <!-- 项目概览 -->
                    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h2 class="text-lg font-semibold mb-1">项目概览</h2>
                                <p class="text-gray-600 text-sm">上次更新于 2023-07-21</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <button class="btn-secondary">
                                    <i class="fa fa-pencil mr-2"></i>
                                    编辑项目
                                </button>
                                <button id="import-design-btn" class="btn-primary">
                                    <i class="fa fa-upload mr-2"></i>
                                    导入设计
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                            <div class="bg-gray-50 rounded-lg p-4">
                                <p class="text-sm text-gray-500">设计文件</p>
                                <p class="text-2xl font-bold">0</p>
                            </div>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <p class="text-sm text-gray-500">代码生成次数</p>
                                <p class="text-2xl font-bold">0</p>
                            </div>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <p class="text-sm text-gray-500">项目成员</p>
                                <p class="text-2xl font-bold">1</p>
                            </div>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <p class="text-sm text-gray-500">项目大小</p>
                                <p class="text-2xl font-bold">0 KB</p>
                            </div>
                        </div>
                    </div>

                    <!-- 设计列表 -->
                    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                        <h3 class="font-semibold mb-4">已导入的设计</h3>
                        <div class="text-center py-12">
                            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa fa-cloud-upload text-gray-400 text-3xl"></i>
                            </div>
                            <h4 class="text-lg font-medium text-gray-900 mb-2">暂无设计文件</h4>
                            <p class="text-gray-500 mb-6">点击“导入设计”按钮，上传你的第一个设计文件。</p>
                            <button id="import-design-btn-2" class="btn-primary">
                                <i class="fa fa-upload mr-2"></i>
                                导入设计
                            </button>
                        </div>
                    </div>

                    <!-- 最近生成的代码 -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="font-semibold mb-4">最近生成的代码</h3>
                        <div class="text-center py-12">
                            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa fa-code text-gray-400 text-3xl"></i>
                            </div>
                            <h4 class="text-lg font-medium text-gray-900 mb-2">暂无生成的代码</h4>
                            <p class="text-gray-500">导入设计文件后，你可以在这里生成和管理代码。</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    


    <!-- 导入设计模态框 -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden" id="import-design-modal">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-xl max-w-lg w-full">
                <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                    <h3 class="text-lg font-semibold">导入设计</h3>
                    <button id="close-import-modal-btn" class="text-gray-500 hover:text-gray-700">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div class="p-6">
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-6">
                        <i class="fa fa-cloud-upload text-gray-400 text-4xl mb-4"></i>
                        <h4 class="font-medium mb-2">拖放文件到这里</h4>
                        <p class="text-sm text-gray-500 mb-4">或者</p>
                        <label class="btn-primary cursor-pointer">
                            <span>选择文件</span>
                            <input type="file" class="hidden" accept=".fig, .sketch, .xd, .psd">
                        </label>
                        <p class="text-xs text-gray-500 mt-4">支持 Figma, Sketch, Adobe XD 和 Photoshop 文件</p>
                    </div>
                    <div>
                        <h4 class="font-medium mb-2">或连接设计工具</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <button class="flex items-center justify-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                                <i class="fa fa-figma text-gray-800 mr-2"></i>
                                <span>Figma</span>
                            </button>
                            <button class="flex items-center justify-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
                                <i class="fa fa-paint-brush text-gray-800 mr-2"></i>
                                <span>Sketch</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t border-gray-200 flex justify-end">
                    <button id="cancel-import-btn" class="btn-secondary mr-3">取消</button>
                    <button id="submit-import-btn" class="btn-primary">导入</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        // 用户菜单切换
        const userMenuButton = document.getElementById('user-menu-button');
        const userDropdown = document.getElementById('user-dropdown');
        
        userMenuButton.addEventListener('click', () => {
            userDropdown.classList.toggle('hidden');
        });
        
        document.addEventListener('click', (e) => {
            if (!userMenuButton.contains(e.target) && !userDropdown.contains(e.target)) {
                userDropdown.classList.add('hidden');
            }
        });

        // 退出登录
        document.getElementById('logout-button').addEventListener('click', function(e) {
            e.preventDefault();
            if (confirm('确定要退出登录吗？')) {
                window.location.href = 'login.html';
            }
        });

        // 导入设计模态框
        const importDesignBtn = document.getElementById('import-design-btn');
        const importDesignBtn2 = document.getElementById('import-design-btn-2');
        const importDesignModal = document.getElementById('import-design-modal');
        const closeImportModalBtn = document.getElementById('close-import-modal-btn');
        const cancelImportBtn = document.getElementById('cancel-import-btn');
        const submitImportBtn = document.getElementById('submit-import-btn');

        function openImportModal() {
            importDesignModal.classList.remove('hidden');
        }

        function closeImportModal() {
            importDesignModal.classList.add('hidden');
        }

        importDesignBtn.addEventListener('click', openImportModal);
        importDesignBtn2.addEventListener('click', openImportModal);
        closeImportModalBtn.addEventListener('click', closeImportModal);
        cancelImportBtn.addEventListener('click', closeImportModal);

        submitImportBtn.addEventListener('click', () => {
            // 模拟导入成功
            alert('设计导入成功！');
            closeImportModal();
        });
    </script>
</body>
</html>
